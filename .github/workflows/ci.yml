name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all shell scripts
        run: |
          shellcheck --version
          # warning+ fails the build; info-level style notes (e.g. SC2059 for
          # the color-escape printf pattern in setup.sh) do not.
          shellcheck --severity=warning setup.sh claude/autonomous-mode.sh claude/hooks/guard.sh claude/scripts/state-sync.sh claude/scripts/state-items.sh claude/scripts/signal-setup.sh tests/*.sh

  validate-json:
    name: Validate JSON manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse every committed JSON file
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 |
            xargs -0 -n1 python3 -m json.tool > /dev/null
          echo "all JSON files parse"

  renderings:
    name: Renderings in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install PyYAML
        run: pip install pyyaml
      - name: kiro/goose renderings match the Claude canonicals
        run: python3 tools/generate_renderings.py --check

  manifests:
    name: Manifests in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: counts, descriptions, plugin-root references, skill frontmatter
        run: python3 tools/check_manifests.py
      - name: plugin version bumped when claude/ changed (pull requests)
        if: github.event_name == 'pull_request'
        run: python3 tools/check_manifests.py --base "origin/${{ github.base_ref }}"

  tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh command installation contract
        run: tests/test_setup_commands.sh
      - name: autonomous mode + guard hook
        run: tests/test_autonomous_mode.sh
      - name: plugin-native guard (hooks.json, guard_mode, --plugin toggle)
        run: tests/test_plugin_guard.sh
      - name: Signal notifier
        run: tests/test_notify.sh
      - name: cross-device state sync
        run: tests/test_state_sync.sh
      - name: manifest drift checker
        run: tests/test_check_manifests.sh
      - name: guard secret-read rules (Track F verdict table)
        run: tests/test_guard_secrets.sh
      - name: state store setup (setup.sh --state)
        run: tests/test_setup_state.sh
      - name: Signal notifications setup script
        run: tests/test_signal_setup.sh
