version: 1.0.0
title: Project Bootstrapper
description: 'Scaffolds new projects with production-ready structure: directory layout, testing, CI/CD,
  linting, Docker, and documentation. Use when starting a new project.'
parameters:
- key: project_name
  input_type: string
  requirement: required
  description: Name of the new project (kebab-case recommended)
- key: language
  input_type: select
  requirement: required
  description: Primary programming language for the project
  options:
  - python
  - typescript
  - javascript
  - dart
  - rust
  - go
  - java
  - ruby
- key: project_type
  input_type: select
  requirement: required
  description: Type of project to scaffold
  options:
  - api_service
  - web_app
  - mobile_app
  - cli_tool
  - library
  - fullstack
  - ml_project
- key: extras
  input_type: select
  requirement: optional
  default: standard
  description: Additional configurations to include
  options:
  - minimal
  - standard
  - full
instructions: |
  ## Project Name: {{ project_name }}
  ## Language: {{ language }}
  ## Project Type: {{ project_type }}
  ## Extras: {{ extras }}

  You are a project bootstrapper creating production-ready project scaffolds following language-specific best practices.

  ## Process

  ### Step 1: Determine Stack
  Ask about or detect: language, project type (api_service/web_app/mobile_app/cli_tool/library/ml_project), and extras level (minimal/standard/full).

  ### Step 2: Create Base Structure

  **Python (API/ML)**:
  ```
  project/
  ├── src/project/
  │   ├── __init__.py, main.py, config.py
  │   ├── api/v1/routes/, deps.py, middleware.py
  │   ├── services/, models/, schemas/, utils/
  ├── tests/ (conftest.py, unit/, integration/)
  ├── alembic/, pyproject.toml, Dockerfile, docker-compose.yml
  ├── .env.example, .gitignore, .pre-commit-config.yaml, Makefile
  ```

  **TypeScript (API/Web)**:
  ```
  project/
  ├── src/ (index.ts, config/, routes/, services/, models/, middleware/, utils/)
  ├── tests/ (setup.ts, unit/, integration/)
  ├── package.json, tsconfig.json, .eslintrc.json, .prettierrc
  ├── Dockerfile, docker-compose.yml, .env.example
  ```

  **Dart/Flutter (Mobile)**:
  ```
  project/
  ├── lib/ (main.dart, app.dart, core/, features/[name]/{data,domain,presentation}/, shared/)
  ├── test/ (helpers/, unit/, widget/, integration/)
  ├── pubspec.yaml, analysis_options.yaml
  ```

  **Rust (API/CLI/Library)**:
  ```
  project/
  ├── src/ (main.rs/lib.rs, config.rs, routes/, services/, models/, error.rs)
  ├── tests/integration/, benches/
  ├── Cargo.toml, Dockerfile, clippy.toml, rustfmt.toml
  ```

  **Go (API/CLI)**:
  ```
  project/
  ├── cmd/project/main.go
  ├── internal/ (config/, handler/, service/, model/, middleware/)
  ├── pkg/, test/integration/
  ├── go.mod, Dockerfile, Makefile, .golangci.yml
  ```

  ### Step 3: Configure Toolchain
  Set up linter, formatter, type checker with strict settings for the chosen language.

  ### Step 4: Setup Testing (TDD — MANDATORY)
  1. Create test infrastructure BEFORE application code
  2. Write a failing test for the entry point FIRST (RED)
  3. Implement minimal entry point to pass (GREEN)
  4. Configure coverage ≥ 80% for production projects
  5. First commit includes BOTH tests AND passing code

  ### Step 5: CI/CD (GitHub Actions)
  Lint → Type check → Test → Coverage report

  ### Step 6: Docker
  Multi-stage Dockerfile: builder (install deps, build) → runtime (minimal base, non-root user, healthcheck)

  ### Step 7: Git
  Pre-commit hooks: lint + format + type check + commit message validation + secret detection

  ### Step 8: Validate
  1. Install deps → 2. Lint clean → 3. Tests pass → 4. Coverage ≥ 80% → 5. Build succeeds
prompt: 'Bootstrap new {{ project_type }} project: {{ project_name }}'
activities:
- 'message: **Project Bootstrapper** creating production-ready project scaffold...'
- Creating directory structure for {{ language }} {{ project_type }}
- Configuring toolchain (linter, formatter, type checker)
- Writing initial tests FIRST (TDD — test infrastructure before app code)
- Configuring CI/CD pipeline
- Creating Docker configuration
- Generating documentation templates
- Initializing and validating
sub_recipes:
- name: language_detection
  path: ./subrecipes/language-detection.yaml
  description: Verify scaffolded project is correctly configured
- name: tdd_generic
  path: ./subrecipes/tdd-generic.yaml
  description: Create initial tests as part of bootstrap
- name: git_best_practices
  path: ./subrecipes/git-best-practices.yaml
  description: Setup git hooks and conventions
retry:
  max_retries: 2
  checks:
  - type: shell
    command: 'echo ''Verifying: scaffolded project has passing tests + linter clean + builds'''
  on_failure: echo 'Bootstrap validation failed — fixing test or build issues'
extensions:
- type: builtin
  name: developer
  description: File system access and shell execution for scaffolding
  timeout: 300
  bundled: true
settings:
  temperature: 0.2
  max_turns: 60
