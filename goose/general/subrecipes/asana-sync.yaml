version: "1.0.0"
title: "Asana Sync"
description: "Best-effort Asana sync for workflows — preflight-checks availability, then creates/updates a task and posts per-phase comments. Degrades gracefully (queues locally) if Asana is unavailable; never blocks the core run. Use as the reporting side-channel in workflows."

parameters:
  - key: project
    input_type: string
    requirement: required
    description: "Target Asana project — a project_gid OR a project_name to resolve"
  - key: task_key
    input_type: string
    requirement: required
    description: "Stable identifier for the work (e.g. feature slug / branch name) used to find-or-create the task idempotently"
  - key: event
    input_type: select
    requirement: required
    description: "What happened in the workflow run"
    options:
      - start
      - comment
      - done
      - blocked
  - key: message
    input_type: string
    requirement: optional
    default: ""
    description: "The note/message to attach to the event"
  - key: assignee
    input_type: string
    requirement: optional
    default: "me"
    description: "Who to assign the task to: me, an email, or a user GID/name"
  - key: create_if_missing
    input_type: boolean
    requirement: optional
    default: false
    description: "Create the project if it doesn't exist"

instructions: |
  You keep an Asana task in sync with a workflow run. Asana is a **best-effort side
  channel**: it must NEVER block or fail the core recipe. If Asana is unavailable, you
  degrade gracefully and queue updates locally — you never lose an update and never
  crash the run.

  ## Project: {{ project }}
  ## Task key: {{ task_key }}
  ## Event: {{ event }} — {{ message }}
  ## Assignee: {{ assignee }}
  ## Create if missing: {{ create_if_missing }}

  ## Asana access in Goose (IMPORTANT)
  Asana operations require an **Asana MCP extension** to be configured in your Goose
  setup (via `goose configure` → add an MCP/remote extension that exposes the Asana
  tools). This recipe does NOT bundle Asana access. If no such extension is configured
  and active, the Asana tools are simply not in scope — in that case this sync is a
  silent **no-op / local queue**, never an error. Refer to whatever Asana tools the
  configured extension provides; do not assume any specific tool naming.

  ## Protocol

  ### 1. PREFLIGHT (read-only, once per run)
  Before any write, verify Asana is **configured**, reachable, AND the target is valid:
  0. **Read config**, in order of precedence: caller inputs → `ASANA_PROJECT_GID` /
     `ASANA_PROJECT_NAME` env → `.goose/asana.json`
     (`{"project_gid"|"project_name", "default_assignee", "create_if_missing"}`).
     If nothing identifies a project, Asana is **not configured** → skip the whole sync
     silently (a no-op, not an error). Default: absent config = no Asana side effects.
  1. If the Asana MCP extension is not configured / its tools are not in scope at all →
     Asana is unavailable. Skip to DEGRADE.
  2. Call the workspaces-list tool (cheap, read-only). On error/timeout → unavailable.
  3. **Resolve & verify the project (find-or-validate, never duplicate):**
     - **GID given** → confirm it exists/accessible with the get-project tool.
     - **Name given** → search via the typeahead/projects-for-workspace tools. One match
       → use it. Multiple → ask which (do NOT guess). None → if `create_if_missing`,
       create the project (in an *organization* this also needs a `team` — ask for it; a
       plain workspace doesn't); otherwise report "project not found" and treat as
       unavailable.
  4. Cache the verdict to `.wf/asana.json`:
     `{ "available": true|false, "project_gid": "...", "assignee": "...", "task_gid": null|"...", "checked": "<run-id>" }`

  If `.wf/asana.json` already has a verdict for this run, reuse it — do NOT re-probe per call.

  ### 2. SYNC (only if `available: true`)
  - **resolve assignee:** caller `assignee` → `.goose/asana.json` `default_assignee` →
    fallback `me`. If a *name* was given, resolve it to a user GID first via the
    typeahead/users tools (don't pass a bare name to the API).
  - **resolve the board's status mechanism (once):** read the project's sections and
    custom fields. Prefer a single-select **"Status"** custom field (To Do / In Progress
    / Done) if present; otherwise treat **sections** as the columns. Cache the
    section/field GIDs.
  - **find-or-create the task (idempotent):** if `task_gid` is null, search for the
    `task_key` within the project; if none, create the task in `project_gid` with the
    resolved `assignee`, placed in the **To Do** section when sections exist. Store the
    returned `task_gid` back into `.wf/asana.json` so later calls reuse it (no duplicate
    tasks).
  - **start** → set status **In Progress**: update the "Status" custom field if present.
    (Note: the available tools place *new* tasks in a section but typically cannot *move*
    an existing one between sections — so when status is section-only, reflect In Progress
    via the field or a "▶ In Progress" comment.)
  - **comment** → post a task story/comment (a short note per gate, e.g. "RED ✅ / GREEN ✅").
  - **done** → update the task (`completed: true`, set Status → Done; append the PR link).
  - **blocked** → post a task story with the blocking findings; leave the task open.
  - After each write, confirm it returned success. Only then consider it synced.

  ### 3. DEGRADE (if `available: false`)
  - Append the update to `.wf/asana-pending.md` as a dated line (event + message + task_key)
    so it can be replayed later. Lose nothing.
  - Do NOT error. Return a clear status: `"asana: unavailable — queued locally (N pending)"`.

  ## Hard rules
  - **Non-blocking:** any Asana error, missing tool/extension, auth failure, or timeout is
    a `could-not-run`, never a recipe failure. Catch it, queue it, report it, move on.
  - **Idempotent:** never create a second task for the same `task_key`; always reuse the
    cached `task_gid`.
  - **Honest:** report `synced` only for writes that returned success; otherwise report
    `queued` or `unavailable`. Never claim an update you didn't confirm.
  - **Confirm before first write** in a shared project: creating/closing tasks is
    outward-facing — if the target project wasn't explicitly provided, ask once.

  ## Output
  A one-line status the caller appends to its report, e.g.:
  `asana: task <gid> → In Progress (2 comments)` or `asana: unavailable — 3 updates queued in .wf/asana-pending.md`.

prompt: "Sync Asana: {{ event }} for {{ task_key }} in {{ project }}"

activities:
  - "message: **Asana Sync** (best-effort). Requires an Asana MCP extension configured in Goose; silently no-ops if unavailable."
  - "Preflight: checking Asana configuration and reachability"
  - "Resolving and verifying the target project"
  - "Find-or-create the task idempotently"
  - "Posting the per-phase update"
  - "Degrading gracefully: queueing locally if unavailable"

extensions:
  - type: builtin
    name: developer
    description: "File system access for reading config and queueing pending updates locally"
    timeout: 300
    bundled: true

settings:
  temperature: 0.1
  max_turns: 30
